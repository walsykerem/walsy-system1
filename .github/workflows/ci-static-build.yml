name: Static build reproducibility

on:
  push:
    branches: [0.1.0-fix-9]
  pull_request:

permissions:
  contents: read

jobs:
  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: Build twice, compare digests
        run: |
          set -euo pipefail
          # -buildvcs=false keeps clean/dirty worktree state out of the digest.
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o walsy-system1 ./cmd/walsy-system1
          sha256sum walsy-system1 | cut -d' ' -f1 > /tmp/walsy-build-1.sha
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o walsy-system1 ./cmd/walsy-system1
          sha256sum walsy-system1 | cut -d' ' -f1 > /tmp/walsy-build-2.sha
          diff /tmp/walsy-build-1.sha /tmp/walsy-build-2.sha
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: walsy-system1-${{ github.sha }}
          path: walsy-system1
