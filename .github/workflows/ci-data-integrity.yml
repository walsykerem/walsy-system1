name: Data integrity

on:
  push:
    branches: [0.1.0-fix-9]
  pull_request:

permissions:
  contents: read

jobs:
  data-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: decision_items.json signature
        run: sha256sum -c decision_items.json.sha256.sig
      - name: ASCII scan (*.go web/*)
        run: |
          set -euo pipefail
          files=()
          for f in *.go web/*; do
            [ -e "$f" ] || continue
            files+=("$f")
          done
          go run ./scripts/asciiscan "${files[@]}"
