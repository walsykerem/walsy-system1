name: Fork isolation read only

# Branch protection is a repo setting and cannot be enforced from YAML.

on:
  push:
    branches:
      - 0.1.0-fix-9
  pull_request:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Assert workflows stay fork-safe and read only
        shell: bash
        run: |
          set -euo pipefail
          # Assemble spellings at runtime so this checker cannot flag itself.
          prt="$(printf '%s%s' 'pull_request' '_target')"
          sec="$(printf '%s%s' 'secret' 's.')"
          bad=0
          for f in .github/workflows/*.yml; do
            if ! grep -qF 'contents: read' "$f"; then
              echo "missing read-only permission: $f"
              bad=1
            fi
            if grep -qF -- "$prt" "$f"; then
              echo "privileged PR trigger: $f"
              bad=1
            fi
            if grep -qF -- "$sec" "$f"; then
              echo "secret reference: $f"
              bad=1
            fi
          done
          if ! grep -lF 'pull_request' .github/workflows/*.yml >/dev/null; then
            echo "no pull_request trigger found"
            bad=1
          fi
          [ "$bad" -eq 0 ] || { echo "fork-isolation check failed"; exit 1; }
          echo "workflows are fork-safe and read only"
