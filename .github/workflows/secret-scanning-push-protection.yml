name: Secret scanning push protection

# GitHub secret scanning + push protection must be enabled in repo settings;
# it cannot be configured from YAML. This scan is a hermetic backstop only.

on:
  push:
    branches:
      - 0.1.0-fix-9
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Scan tracked text for key-shaped tokens
        shell: bash
        run: |
          set -euo pipefail
          pat='evren_llm_[A-Za-z0-9_-]{20,}'
          found=0
          while IFS= read -r f; do
            if grep -IqE -- "$pat" "$f"; then
              c="$(grep -IcE -- "$pat" "$f" || true)"
              echo "key-shaped token in $f: $c"
              found=1
            fi
          done < <(git ls-files)
          [ "$found" -eq 0 ] || { echo "key-shaped token found; do not print or reuse it"; exit 1; }
          echo "no key-shaped tokens in tracked text"
