name: CI evidence freshness

on:
  push:
    branches:
      - 0.1.0-fix-9
  pull_request:

permissions:
  contents: read

jobs:
  evidence-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Verify cited binary digest has not drifted
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sed -n 's/.*"file_sha256":"\([0-9a-f]*\)".*/\1/p' walsy-system1.digest.json)"
          src='scripts/finalgate/main.go'
          k12='scripts/finalgate/evidence/K12.txt'
          grep -qF -- "$sha" "$src" || { echo "cited digest missing from $src"; exit 1; }
          grep -qF -- "$sha" "$k12" || { echo "cited digest missing from $k12"; exit 1; }
          if [ -f walsy-system1 ]; then
            actual="$(sha256sum walsy-system1 | cut -d ' ' -f 1)"
            [ "$actual" = "$sha" ] || { echo "digest drift: binary $actual vs cited $sha"; exit 1; }
            echo "binary digest matches citation"
          else
            echo "binary absent; citation present in $src, $k12"
          fi
