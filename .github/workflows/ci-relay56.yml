name: Relay56 hermetic harness

on:
  push:
    branches: [0.1.0-fix-9]
  pull_request:

permissions:
  contents: read

jobs:
  relay56:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: Run hermetic relay harness
        run: |
          set -euo pipefail
          # The harness uses its own loopback stub and test key; no live call, no key here.
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o walsy-system1 .
          export RELAY56_BIN="$PWD/walsy-system1"
          CGO_ENABLED=0 go run ./scripts/relay56 > /tmp/relay56-transcript.txt || { cat /tmp/relay56-transcript.txt; exit 1; }
          cat /tmp/relay56-transcript.txt
          grep -qx 'RELAY-OK' /tmp/relay56-transcript.txt
          ! grep -q 'FAIL' /tmp/relay56-transcript.txt
          # shortcut: TRANSCRIPT.txt headers include a timestamp and a random loopback endpoint, so they are reported, not enforced; upgrade when the harness emits stable hashes.
