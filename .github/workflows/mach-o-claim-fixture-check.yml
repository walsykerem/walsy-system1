name: mach-o claim fixture check

permissions:
  contents: read

on:
  push:
    branches:
      - 1.0.0-fix-9
  pull_request:

jobs:
  fixture-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.26.5'

      - name: Hermetic rebuild
        shell: bash
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=false -o walsy-system1 .

      - name: Assert shipped SHA256 claims
        shell: bash
        run: |
          set -euo pipefail
          got="$(sha256sum walsy-system1 | awk '{print $1}')"
          lit="$(grep -oE 'w24ShippedSHA256[[:space:]]*=[[:space:]]*"[0-9a-f]{64}"' sim_e1_e2_test.go | grep -oE '[0-9a-f]{64}' | head -n1)"
          dig="$(grep -oE '"file_sha256"[[:space:]]*:[[:space:]]*"[0-9a-f]{64}"' walsy-system1.digest.json | grep -oE '[0-9a-f]{64}' | head -n1)"
          echo "rebuilt sha256 = $got"
          echo "test literal   = $lit"
          echo "digest.json    = $dig"
          [ -n "$lit" ] || { echo 'FAIL: w24ShippedSHA256 literal missing'; exit 1; }
          [ -n "$dig" ] || { echo 'FAIL: file_sha256 missing in walsy-system1.digest.json'; exit 1; }
          [ "$got" = "$lit" ] || { echo 'FAIL: rebuilt binary != w24ShippedSHA256'; exit 1; }
          [ "$got" = "$dig" ] || { echo 'FAIL: rebuilt binary != digest.json file_sha256'; exit 1; }
          echo 'OK: rebuilt digest matches both fixture claims'

      - name: Check pclntab function-count claim
        shell: bash
        run: |
          set -euo pipefail
          lit="$(grep -oE 'w23_FuncCount[[:space:]]*=[[:space:]]*[0-9]+' sim_q5_q6_test.go | grep -oE '[0-9]+$' | head -n1)"
          echo "w23_FuncCount literal = $lit"
          [ -n "$lit" ] || { echo 'FAIL: w23_FuncCount literal missing'; exit 1; }
          echo 'NOTE: w23_FuncCount is a __gopclntab function count (sim_q5_q6_test.go:224),'
          echo '      not a Mach-O symbol-table count; the " T " symbol count does not match.'
          echo '      Native symbol-count verification needs walsyrea/lrecon locally (not in CI).'
